buildscript {
    repositories {
        maven {
            url 'https://dl.bintray.com/giancosta86/Hephaestus'
        }

        jcenter()
    }

    dependencies {
        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.6'
        classpath 'info.gianlucacosta.moonlicense:moonlicense-gradle:4.3'
        classpath 'info.gianlucacosta.aurora:aurora:6.0'
    }
}


apply plugin: 'scala'
apply plugin: 'maven'
apply plugin: 'osgi'
apply plugin: 'com.jfrog.bintray'
apply plugin: 'info.gianlucacosta.moonlicense'
apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.omnieditor'
archivesBaseName = 'omnieditor'
version '5.0'


description = 'Ready-made ScalaFX IDE for custom languages'



dependencies {
    generatedCompile 'org.scala-lang:scala-library:2.11.8'

    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'org.fxmisc.richtext:richtextfx:0.6.10'

    compile 'info.gianlucacosta.helios:helios-fx:5.0'
}



aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }

    bintray {
        repo = 'Hephaestus'
        licenses = ['Apache-2.0']
        labels = [
                'custom languages',
                'ready-made',
                'IDE',
                'code editor',
                'syntax highlighting',
                'ScalaFX',
                'library',
                'Scala',
                'Java'
        ]
    }
}


moonLicense {
    license = apache2

    productInfo {
        productName = 'OmniEditor'
        inceptionYear = 2015
        copyrightHolder = 'Gianluca Costa'
    }
}
